name: Refresh data and deploy

on:
  schedule:
    - cron: "17 9 * * *"  # daily, 09:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      problems: ${{ steps.build.outputs.problems }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests
      - id: build
        run: python pipeline/build.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh data $(date -u +%F)"
            git push
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # Runs after deploy so good data still ships, but turns the run red while any chamber is broken.
  coverage:
    needs: [build, deploy]
    if: needs.build.outputs.problems
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::${{ needs.build.outputs.problems }} chambers have errors; see the warnings in the build log"
          exit 1
